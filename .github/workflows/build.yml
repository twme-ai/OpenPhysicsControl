name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Spigot API compatibility
        run: ./gradlew clean test -PserverPlatform=spigot

      - name: Build Paper artifact
        run: ./gradlew clean test shadowJar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: OpenPhysicsControl-${{ github.sha }}
          path: build/libs/OpenPhysicsControl.jar
          if-no-files-found: error
          retention-days: 14
