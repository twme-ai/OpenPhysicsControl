name: OpenPhysicsControl
version: '${version}'
main: dev.openphysicscontrol.OpenPhysicsControlPlugin
description: 'Open source per-world physics controls for Bukkit servers'
api-version: '1.13'
folia-supported: true
authors: [OpenPhysicsControl contributors]
commands:
  openphysics:
    aliases: [ophysics, opc, pc]
    description: 'Manage world physics rules'
    usage: '/<command> [set|material|language|reload]'
permissions:
  openphysicscontrol.menu:
    description: 'Open the physics rules menu for the current world'
    default: op
  openphysicscontrol.set:
    description: 'Change physics rules in any loaded world'
    default: op
  openphysicscontrol.set.current-world:
    description: "Change physics rules only in the player's current world"
    default: false
  openphysicscontrol.reload:
    description: 'Reload OpenPhysicsControl configuration and world rules'
    default: op
